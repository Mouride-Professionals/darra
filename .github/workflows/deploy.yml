name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Prevent concurrent deployments (queue them, never cancel in-flight)
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com
  REMOTE_DIR: /opt/daara

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the single app image (backend + built frontend) and push
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA as image tag
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Pull latest image for layer cache
        run: |
          docker pull "$REGISTRY/${{ secrets.DO_REGISTRY_NAME }}/daara:latest" || true

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://darrasn.samafacture.com/api \
            --cache-from "$REGISTRY/${{ secrets.DO_REGISTRY_NAME }}/daara:latest" \
            --tag "$REGISTRY/${{ secrets.DO_REGISTRY_NAME }}/daara:${{ steps.meta.outputs.sha_short }}" \
            --tag "$REGISTRY/${{ secrets.DO_REGISTRY_NAME }}/daara:latest" \
            .

      - name: Push to Container Registry
        run: |
          docker push "$REGISTRY/${{ secrets.DO_REGISTRY_NAME }}/daara:${{ steps.meta.outputs.sha_short }}"
          docker push "$REGISTRY/${{ secrets.DO_REGISTRY_NAME }}/daara:latest"

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Droplet via SSH
  # Requires the 'production' GitHub Environment (for optional approval gates)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy updated compose file and nginx config to the server
      - name: Upload docker-compose and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,infra/nginx/"
          target: ${{ env.REMOTE_DIR }}

      # SSH in and perform the rolling deploy
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY: registry.digitalocean.com
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DO_API_TOKEN,REGISTRY_NAME,IMAGE_TAG,REGISTRY
          script: |
            set -e
            cd ${{ env.REMOTE_DIR }}

            # ----------------------------------------------------------------
            # Phase 0 — capture previous state for rollback
            # ----------------------------------------------------------------
            PREVIOUS_TAG=$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2)
            echo "==> Current tag: ${PREVIOUS_TAG} → deploying: ${IMAGE_TAG}"

            rollback_app() {
              echo "!!! Rolling back to ${PREVIOUS_TAG}..."
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREVIOUS_TAG}/" .env
              docker compose -f docker-compose.yml pull
              docker compose -f docker-compose.yml up -d --remove-orphans
              echo "!!! Rolled back. No schema migrations exist in this app — rollback is fully safe."
              exit 1
            }

            # ----------------------------------------------------------------
            # Phase 1 — authenticate and pull new image
            # ----------------------------------------------------------------
            echo "==> [1/4] Authenticating with DO Container Registry..."
            echo "$DO_API_TOKEN" | \
              docker login "$REGISTRY" --username "$DO_API_TOKEN" --password-stdin

            echo "==> Updating image tag to ${IMAGE_TAG}..."
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

            echo "==> Pulling new image..."
            docker compose -f docker-compose.yml pull || rollback_app

            # ----------------------------------------------------------------
            # Phase 2 — start containers
            # ----------------------------------------------------------------
            echo "==> [2/4] Starting containers..."
            docker compose -f docker-compose.yml up -d --remove-orphans || rollback_app

            # ----------------------------------------------------------------
            # Phase 3 — health gate (wait for app container to be healthy)
            # ----------------------------------------------------------------
            echo "==> [3/4] Waiting for app container to be healthy..."
            APP_CONTAINER=$(docker compose -f docker-compose.yml ps -q app)
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$APP_CONTAINER" 2>/dev/null || echo "none")
              if [ "$STATUS" = "healthy" ]; then
                echo "    Container is healthy."
                break
              elif [ "$STATUS" = "unhealthy" ]; then
                echo "!!! Container is unhealthy after ${i} checks."
                rollback_app
              fi
              echo "    Attempt ${i}/24 — status: ${STATUS}. Waiting 5s..."
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "!!! Health check never reported healthy."
              rollback_app
            fi

            # ----------------------------------------------------------------
            # Phase 4 — reload nginx so it re-resolves the new app container IP
            # Nginx caches the upstream IP at startup; after the app container
            # is replaced its IP changes, causing 502s until nginx is reloaded.
            # ----------------------------------------------------------------
            echo "==> [4/4] Reloading nginx and cleaning up..."
            docker compose -f docker-compose.yml restart nginx
            docker image prune -f

            echo "==> Deploy complete! Running tag: ${IMAGE_TAG}"
